</div></div>

<div class="w-full flex flex-col items-center text-center gap-space-sm pb-2">

</div>

</div>
<script>
    // Micro-interaction: tactile feedback on emblem tap
    (function initSplashMicro() {
      const emblem = document.getElementById('koodamEmblemTouch');
      if (!emblem) return;
      emblem.addEventListener('click', function() {
        emblem.classList.add('scale-105');
        setTimeout(() => {
          emblem.classList.remove('scale-105');
        }, 220);
      });
    })();
  </script>
